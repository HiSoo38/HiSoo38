# README 의 GitHub Activity 칸에 쓰는 3D 잔디 SVG(가입일 ~ 오늘 전체 기간)를 만들어 output 브랜치에 올린다
name: Generate profile assets

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 3D 잔디 도구는 1년치만 그리므로 Action 대신 소스를 받아 전체 기간용으로 실행한다
      - uses: actions/checkout@v5
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: v0.9.3
          path: .3d-contrib

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # 칸 너비가 1년(64칸)에 고정돼 있어, 주 수가 많으면 그만큼 칸을 줄이도록 한 줄 고친 뒤 컴파일한다
      - name: Build 3D contrib library
        working-directory: .3d-contrib
        run: |
          npm ci --no-audit --no-fund
          sed -i 's#const dx = width / 64;#const dx = width / Math.max(64, weekcount + 11);#' src/create-3d-contrib.ts
          grep -q 'Math.max(64, weekcount + 11)' src/create-3d-contrib.ts
          npx tsc

      # 결과: public/profile-3d-contrib/profile-night-view.svg
      - name: Generate all-time 3D contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/3d-contrib-all-time.cjs .3d-contrib/dist0/src public/profile-3d-contrib

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
