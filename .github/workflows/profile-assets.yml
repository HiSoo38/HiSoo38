# README 의 GitHub Activity 칸에 쓰는 3D 잔디 SVG(최근 1년)를 만들어 output 브랜치에 올린다
name: Generate profile assets

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 결과: ./profile-3d-contrib/profile-*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # output 브랜치는 매번 통째로 바뀐다 — README 는 output/profile-3d-contrib/*.svg 경로로 읽으므로 폴더째 올린다
      - run: |
          mkdir public
          cp -r profile-3d-contrib public/

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
